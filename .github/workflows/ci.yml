name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — this repo was rebuilt after a leak
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      # Workspace root install — hoists shared deps for every package.
      - run: npm ci
        working-directory: .
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Lint
        # Errors must be zero. The 115 remaining warnings are `any`-typed
        # surfaces in pre-existing code (ScreeningAgent prompt handling,
        # postgres_repo query building, GoogleSheetsService). This cap only
        # ever moves down — lower it as those modules gain types.
        run: npx eslint . --max-warnings 115
      - name: Format check
        run: npx prettier --check "src/**/*.ts"
      - name: Test
        run: npm test --if-present
      - name: Audit
        run: npm audit --audit-level=critical
        continue-on-error: true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      - name: Typecheck
        run: npx tsc -b --force
      - name: Lint
        run: npx eslint . --max-warnings 100
      - name: Build
        run: npm run build
        env:
          # Build must not depend on a real key — B2 means none is embedded.
          NODE_ENV: production
      - name: Assert no Meilisearch key in the bundle
        # Regression guard for B2: fails the build if anything that looks like
        # a Meilisearch key is inlined into the shipped JavaScript.
        run: |
          if grep -rEl "(MEILI_MASTER_KEY|masterKey|apiKey\s*:\s*['\"][A-Za-z0-9@%!*^]{20,})" dist/assets/*.js 2>/dev/null; then
            echo "::error::A Meilisearch key appears in the production bundle"
            exit 1
          fi
          echo "No key found in bundle."

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install tooling
        run: pip install ruff mypy pytest
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Typecheck retrieval service
        run: mypy services/retrieval --ignore-missing-imports
        continue-on-error: true
      - name: Compile all modules
        run: python -m compileall -q services/retrieval machine_learning/src

  images:
    name: Build images
    needs: [secret-scan, backend, frontend, python]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: packages/api
            image: metaview-api
          - context: services/retrieval
            image: metaview-retrieval
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ matrix.image }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
