name: metaview

x-logging: &default-logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: postgres:15.8-alpine
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
    secrets: [db_user, db_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    networks: [backend]            # no host port — reachable only in-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/db_user) -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources: { limits: { cpus: '2.0', memory: 4G } }
    logging: *default-logging
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.6
    environment:
      MEILI_MASTER_KEY_FILE: /run/secrets/meili_key   # no inline default
      MEILI_ENV: production                            # was `development`
      MEILI_NO_ANALYTICS: "true"
    secrets: [meili_key]
    volumes: [meilisearch_data:/meili_data]
    networks: [backend]
    healthcheck:
      test: ["CMD", "meilisearch", "--help"]
      interval: 15s
      retries: 4
    logging: *default-logging
    restart: unless-stopped

  api:
    build: { context: ./packages/api }
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      MEILI_URL: http://meilisearch:7700
      RETRIEVAL_SERVICE_URL: http://retrieval:8765
    secrets: [db_password, meili_key, api_pass, openai_key]
    depends_on:
      postgres:    { condition: service_healthy }
      meilisearch: { condition: service_healthy }
    networks: [backend, frontend]
    read_only: true                      # writable state lives in tmpfs only
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      replicas: 2                        # safe only after §3.4 durable queue
      resources: { limits: { cpus: '1.0', memory: 1G } }
    logging: *default-logging
    restart: unless-stopped

  retrieval:
    build: { context: ./services/retrieval }
    environment:
      DB_HOST: postgres
      VECTOR_DB_HOST: pgvector_search
      MEILI_URL: http://meilisearch:7700
    depends_on:
      postgres:        { condition: service_healthy }
      pgvector_search: { condition: service_healthy }
    networks: [backend]
    deploy:
      resources: { limits: { cpus: '4.0', memory: 8G } }   # model residency
    logging: *default-logging
    restart: unless-stopped

networks:
  backend:  { internal: true }   # no egress path from the data tier
  frontend: {}

secrets:
  db_user:      { file: ./secrets/db_user.txt }
  db_password:  { file: ./secrets/db_password.txt }
  meili_key:    { file: ./secrets/meili_key.txt }
  api_pass:     { file: ./secrets/api_pass.txt }
  openai_key:   { file: ./secrets/openai_key.txt }

volumes: { postgres_data: {}, pgvector_data: {}, meilisearch_data: {} }
