repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks: [{ id: gitleaks }]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks: [{ id: ruff, args: [--fix] }, { id: ruff-format }]
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks: [{ id: nbstripout }]        # notebooks/ currently commits outputs
  - repo: local
    hooks:
      - id: no-large-files
        name: Block files > 1MB
        entry: bash -c 'git diff --cached --name-only | while read f; do [ -f "$f" ] && [ $(wc -c <"$f") -gt 1048576 ] && echo "Too large: $f" && exit 1; done; exit 0'
        language: system
